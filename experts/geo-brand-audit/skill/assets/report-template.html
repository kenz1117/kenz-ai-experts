<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO 可见度审计报告</title>
<style>
/* ═══════════════════════════════════════════════════════════
   品牌 GEO 可见度审计 — 汇报版
   审美方向：瑞士国际主义网格（Swiss / International Typographic Style）
   纯白底 · 无衬线粗体大字 · 发丝线网格 · 黑白高对比
   品牌橙为唯一强调色 · 无圆角无阴影 · 左对齐右不齐
   ═══════════════════════════════════════════════════════════ */

:root{
  /* 纸与墨 —— 纯白与中性灰，不带暖调 */
  --paper:#FFFFFF;
  --paper-2:#F4F4F4;
  --paper-3:#EAEAEA;
  --card:#FFFFFF;
  --ink:#0A0A0A;
  --ink-2:#525252;
  --ink-3:#8A8A8A;
  --ink-4:#BFBFBF;
  --rule:#DEDEDE;
  --rule-soft:#EDEDED;

  /* 品牌 — 取自 Hyreal FDE logo 实测色（全篇唯一强调色） */
  --brand:#D96F18;
  --brand-bright:#E8832C;
  --brand-deep:#A9560F;
  --brand-soft:#FDEDE0;

  /* 语义 —— 克制、去饱和，不与品牌橙抢戏 */
  --good:#1F7A4D;
  --ok:#2F7A6A;
  --warn:#8A6A1F;
  --bad:#B3261E;

  /* 证据等级 —— 黑 / 强调橙 / 灰，强度递减即语义递减 */
  --ev-L1:#0A0A0A;
  --ev-L2:#D96F18;
  --ev-L3:#BFBFBF;

  /* 字体 —— 瑞士国际主义的正统选择是现代无衬线（grotesque） */
  --f-display:"Helvetica Neue","Helvetica","Arial Nova","Arial","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-body:"Helvetica Neue","Helvetica","Arial Nova","Arial","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:"SF Mono","JetBrains Mono","Menlo","Consolas","Liberation Mono",monospace;

  /* 精确、机械的缓动 —— 不做弹性回弹 */
  --ease:cubic-bezier(.2,.7,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  font-family:var(--f-body);
  color:var(--ink);
  background:var(--paper);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  padding:0 0 72px;
  position:relative;
}

/* 12 栏网格底纹 —— 瑞士网格系统的可视化 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(to right, rgba(10,10,10,.045) 1px, transparent 1px);
  background-size:calc(min(1400px,88vw) / 12) 100%;
  background-position:center top;
}

.wrap{max-width:min(1400px,88vw);margin:0 auto;padding:0 36px;position:relative;z-index:1}

/* ── 动效：短促、精确、阶梯揭示 ── */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drawRule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes radarIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes figureIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.reveal{animation:rise .55s var(--ease) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ══════════ 报头 ══════════ */
.masthead{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:20px;padding:30px 0 12px;flex-wrap:wrap;
  animation:fadeIn .5s var(--ease) both;
}
.mast-logo{height:24px;display:block}
.mast-right{text-align:right}
.mast-kind{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink);font-weight:700;
}
.mast-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;letter-spacing:.02em}

/* 报头下的粗黑线 —— 瑞士海报的标志性横杠 */
.mast-rule{
  height:4px;background:var(--ink);transform-origin:left;
  animation:drawRule .7s .05s var(--ease) both;
}

/* ══════════ 标题区 ══════════ */
.title{padding:44px 0 32px;animation:rise .6s .1s var(--ease) both}
.eyebrow{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:16px;font-weight:600;
}
.title h1{
  font-family:var(--f-display);
  font-size:clamp(38px,6.4vw,68px);
  font-weight:700;line-height:1.02;letter-spacing:-.035em;
  color:var(--ink);
}
.title h1 .sep{color:var(--brand);padding:0 .12em;font-weight:400}
.title h1 .cat{color:var(--ink-3);font-weight:400}
.title-meta{
  margin-top:22px;display:flex;gap:0;flex-wrap:wrap;
  font-size:12px;color:var(--ink-3);
}
.title-meta span{padding:0 18px 0 0;margin-right:18px;border-right:1px solid var(--rule)}
.title-meta span:last-child{border-right:0;margin-right:0}
.title-meta b{color:var(--ink);font-weight:700}
.title-meta a{color:var(--brand-deep);text-decoration:none;border-bottom:1px solid var(--brand)}

/* ══════════ Hero：大数字 ══════════ */
.hero{
  display:grid;grid-template-columns:minmax(200px,300px) 1fr;
  gap:0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);
  animation:rise .6s .18s var(--ease) both;
}
.hero-fig{
  padding:32px 28px 28px 0;
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;justify-content:center;
}
.hero-num{
  font-family:var(--f-display);
  font-size:clamp(84px,12vw,140px);
  line-height:.82;letter-spacing:-.055em;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  animation:figureIn .65s .26s var(--ease) both;
}
.hero-denom{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;
  color:var(--ink-3);margin-top:14px;text-transform:uppercase;
}
.hero-lvl{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  padding:4px 0;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;
}
.hero-lvl::before{content:"";width:10px;height:10px;background:currentColor}

.hero-body{padding:32px 0 28px 32px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.hero-verdict{font-size:15px;color:var(--ink-2);line-height:1.7;max-width:74ch}

.cov-block{display:flex;flex-direction:column;gap:10px}
.cov-label{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;
}
.cov-bar{display:flex;height:10px;overflow:hidden;background:var(--paper-3)}
.cov-bar i{display:block;height:100%;transform-origin:left;animation:barIn .6s var(--ease) both}
.cov-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* 证据等级 chip —— 方形、无圆角 */
.chip{
  display:inline-flex;align-items:baseline;gap:5px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  padding:3px 7px;border:1px solid transparent;
  white-space:nowrap;text-transform:uppercase;
}
.chip .k{font-weight:700}
.chip .v{opacity:.75}
.chip.L1{color:var(--paper);background:var(--ev-L1);border-color:var(--ev-L1)}
.chip.L2{color:var(--ev-L2);background:var(--brand-soft);border-color:#F3D4B4}
.chip.L3{color:var(--ink-2);background:var(--paper-2);border-color:var(--rule)}

.conf{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  color:var(--ink-3);text-transform:uppercase;
}
.conf b{color:var(--ink);font-weight:700}

/* ══════════ 章节 ══════════ */
section{padding:52px 0 0}
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:18px}
.sec-no{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;
  color:var(--brand);font-weight:700;padding-top:3px;flex:none;
}
.sec-title{
  font-family:var(--f-display);font-size:clamp(22px,2.6vw,30px);font-weight:700;
  letter-spacing:-.03em;color:var(--ink);line-height:1.1;
}
.sec-note{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;
  color:var(--ink-3);margin-left:auto;text-transform:uppercase;
}

.sec-rule{height:2px;background:var(--ink);margin-bottom:26px;transform-origin:left}

/* ══════════ 通用 card ══════════ */
.card{
  background:var(--card);border:1px solid var(--rule);
  padding:26px 28px;
}
.card.tint{background:var(--paper-2);border-color:var(--ink)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two.wide-l{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr)}
@media(max-width:820px){.two,.two.wide-l{grid-template-columns:1fr}}

/* ══════════ 六维 ══════════ */
.radar-card{display:flex;flex-direction:column}
.radar-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 0}
.radar-shape{transform-origin:center;animation:radarIn .7s .22s var(--ease) both}
.radar-cap{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
  color:var(--ink-3);text-align:left;line-height:1.8;
  padding-top:14px;margin-top:8px;border-top:1px solid var(--rule);
}
.radar-cap b{color:var(--brand-deep);font-weight:700}

.dim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(276px,1fr));gap:0;
  border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.dim{
  padding:16px 18px;background:var(--card);
  border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  border-left:3px solid var(--ink-4);
}
.dim-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dim-nm{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.dim-wt{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--ink-3);margin-left:8px;font-weight:400;
}
.dim-sc{
  font-family:var(--f-display);font-size:26px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.04em;font-weight:700;
}
.dim-meter{height:6px;background:var(--paper-3);margin:11px 0 9px;overflow:hidden}
.dim-meter i{display:block;height:100%;transform-origin:left;animation:barIn .6s var(--ease) both}
.dim-cm{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.dim-chips{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.dim .chip{background:var(--card)}
.dim-flag{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--paper);background:var(--bad);text-transform:uppercase;
  padding:2px 7px;
}

/* ══════════ 发现列表 ══════════ */
ul.pts{list-style:none}
ul.pts li{
  position:relative;padding-left:24px;font-size:13.5px;color:var(--ink-2);
  margin-bottom:13px;line-height:1.65;
}
ul.pts li:last-child{margin-bottom:0}
ul.pts li::before{
  position:absolute;left:0;top:0;
  font-family:var(--f-mono);font-size:13px;font-weight:700;
}
ul.pts.good li::before{content:"+";color:var(--good)}
ul.pts.bad li::before{content:"–";color:var(--warn)}

/* ══════════ 声量份额 ══════════ */
.sov{margin-bottom:16px}
.sov:last-child{margin-bottom:0}
.sov-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:6px}
.sov-nm{color:var(--ink-2)}
.sov.me .sov-nm{color:var(--ink);font-weight:700}
.sov-v{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.sov.me .sov-v{color:var(--brand-deep);font-weight:700}
.sov-track{height:10px;background:var(--paper-3);overflow:hidden}
.sov-track i{
  display:block;height:100%;transform-origin:left;
  background:var(--ink-4);animation:barIn .6s var(--ease) both;
}
.sov.me .sov-track i{background:var(--brand)}
.rank-badge{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--ink-2);
  border:1px solid var(--ink);padding:3px 9px;text-transform:uppercase;
}
.rank-badge b{color:var(--brand-deep)}

/* ══════════ 预期分 ══════════ */
.proj{margin-bottom:18px}
.proj:last-child{margin-bottom:0}
.proj-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.proj-nm{font-size:13.5px;font-weight:700}
.proj-d{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.proj-d b{color:var(--good);font-weight:700}
.proj-rows{display:flex;flex-direction:column;gap:5px}
.proj-row{display:flex;align-items:center;gap:10px}
.proj-lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-3);width:30px;flex:none;text-transform:uppercase}
.proj-track{flex:1;height:12px;background:var(--paper-3);overflow:hidden}
.proj-track i{display:block;height:100%;transform-origin:left;animation:barIn .6s var(--ease) both}
.proj-val{
  font-family:var(--f-mono);font-size:11px;width:26px;text-align:right;flex:none;
  font-variant-numeric:tabular-nums;color:var(--ink-3);
}
.score-jump{
  font-family:var(--f-display);font-size:clamp(26px,3.4vw,38px);letter-spacing:-.04em;
  color:var(--ink);line-height:1;font-weight:700;
}
.score-jump .arrow{color:var(--brand);padding:0 .12em;font-weight:400}
.score-jump .to{color:var(--good)}

/* ══════════ 行动项 ══════════ */
.act{
  padding:18px 0;border-bottom:1px solid var(--rule);
  transition:background .15s var(--ease);
}
.act:first-child{padding-top:0}
.act:last-child{border-bottom:0;padding-bottom:0}
.act:hover{background:var(--paper-2);margin:0 -14px;padding-left:14px;padding-right:14px}
.act-t{font-size:14.5px;font-weight:700;margin-bottom:6px;line-height:1.45;letter-spacing:-.01em}
.act-d{font-size:13px;color:var(--ink-2);line-height:1.65;margin-bottom:10px}
.act-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
  padding:3px 7px;background:var(--paper-2);
  color:var(--ink-2);border:1px solid var(--rule);text-transform:uppercase;
}
.tag.p0{background:var(--bad);color:var(--paper);border-color:var(--bad);font-weight:700}
.tag.p1{background:var(--warn);color:var(--paper);border-color:var(--warn);font-weight:700}
.tag.p2{background:var(--ink-3);color:var(--paper);border-color:var(--ink-3);font-weight:700}
.tag.gain{background:var(--paper);color:var(--good);border-color:var(--good)}
.tag.eff{background:var(--paper-2);color:var(--ink-3)}

/* ══════════ 表格 ══════════ */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);font-weight:700;text-align:left;
  padding:0 10px 8px;border-bottom:2px solid var(--ink);
}
th.r,td.r{text-align:right}
td{padding:11px 10px;border-bottom:1px solid var(--rule-soft);color:var(--ink-2)}
td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
tr.dim-row td:first-child{color:var(--ink);font-weight:700}
.delta-up{color:var(--good);font-weight:700}
.delta-dn{color:var(--bad);font-weight:700}
.delta-fl{color:var(--ink-4)}

/* ══════════ 附录 ══════════ */
details.sim{border:1px solid var(--ink);background:var(--paper)}
details.sim summary{
  cursor:pointer;padding:14px 18px;list-style:none;
  font-size:13.5px;font-weight:700;color:var(--ink);
  display:flex;align-items:center;gap:10px;letter-spacing:-.01em;
}
details.sim summary::-webkit-details-marker{display:none}
details.sim summary::before{
  content:"+";color:var(--brand);font-size:15px;font-weight:700;
  font-family:var(--f-mono);transition:transform .2s var(--ease);
}
details.sim[open] summary::before{content:"–"}
.sim-body{padding:0 18px 20px}
.simwarn{
  font-size:12.5px;color:var(--ink-2);line-height:1.65;
  background:var(--paper-2);border-left:3px solid var(--warn);
  padding:11px 14px;margin-bottom:16px;
}

/* ══════════ 页脚 ══════════ */
.foot{
  margin-top:64px;padding-top:26px;border-top:4px solid var(--ink);
  display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start;
}
.foot-logo{height:18px;display:block;grid-row:1;grid-column:2}
.foot-credit{font-size:11.5px;color:var(--ink-3);line-height:1.85;grid-row:1;grid-column:1}
.foot-credit b{color:var(--ink);font-weight:700}
.foot-legend{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  color:var(--ink-3);margin-top:10px;text-transform:uppercase;grid-row:2;grid-column:1;
}
.lowl1{
  font-size:12.5px;color:var(--ink);background:var(--paper-2);
  border-left:3px solid var(--warn);
  padding:11px 14px;margin-bottom:20px;text-align:left;line-height:1.65;
}
.lowl1 b{color:var(--brand-deep)}

.empty{font-size:13px;color:var(--ink-4)}

/* ══════════ 执行摘要（金字塔顶层） ══════════ */
.exec{padding:36px 0 0}
.exec-eyebrow{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--brand);margin-bottom:14px;font-weight:700;
}
.exec-headline{
  font-family:var(--f-display);font-size:clamp(21px,2.8vw,32px);
  line-height:1.35;font-weight:700;letter-spacing:-.033em;color:var(--ink);
  padding-bottom:22px;border-bottom:2px solid var(--ink);margin-bottom:6px;
}
.exec-j{list-style:none}
.exec-j li{
  display:flex;gap:20px;align-items:flex-start;
  padding:16px 0;border-bottom:1px solid var(--rule);
}
.exec-j li:last-child{border-bottom:0}
.exec-no{
  font-family:var(--f-mono);font-size:11px;color:var(--brand);
  font-weight:700;padding-top:5px;flex:none;letter-spacing:.1em;
}
.exec-txt{flex:1;font-size:14px;line-height:1.7;color:var(--ink-2)}
.exec-ev{margin-top:9px}
.exec-opp{
  margin-top:24px;padding:20px 22px;background:var(--ink);color:var(--paper);
}
.exec-opp .lb{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--brand-bright);font-weight:700;margin-bottom:8px;
}
.exec-opp .tx{font-size:14px;line-height:1.7;color:var(--paper)}
.exec-opp .gn{
  display:inline-block;margin-top:12px;font-family:var(--f-mono);font-size:11.5px;
  font-weight:700;color:var(--paper);background:var(--brand);
  padding:4px 10px;letter-spacing:.08em;
}

/* ══════════ 分数瀑布 ══════════ */
.wf-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--ink-3)}
.wf-legend span{display:inline-flex;align-items:center;gap:6px}
.wf-legend i{width:11px;height:11px;display:inline-block}

/* ══════════ 根因链 ══════════ */
.rc{padding:20px 0;border-bottom:1px solid var(--rule)}
.rc:first-child{padding-top:0}
.rc:last-child{border-bottom:0;padding-bottom:0}
.rc-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.rc-nm{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.rc-wt{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.1em}
.rc-sc{margin-left:auto;font-family:var(--f-display);font-size:21px;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.03em}
.rc-chain{list-style:none;position:relative;padding-left:22px}
.rc-chain::before{
  content:"";position:absolute;left:6px;top:10px;bottom:10px;width:1px;background:var(--rule);
}
.rc-chain li{position:relative;padding:6px 0;font-size:13px;line-height:1.65;color:var(--ink-2)}
.rc-chain li::before{
  content:"";position:absolute;left:-22px;top:11px;width:9px;height:9px;
  background:var(--card);border:2px solid var(--ink-4);
}
.rc-chain li.s::before{border-color:var(--ink-3)}
.rc-chain li.d::before{border-color:var(--warn)}
.rc-chain li.r::before{border-color:var(--brand);background:var(--brand)}
.rc-k{
  display:inline-block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;
  color:var(--ink-3);margin-right:10px;min-width:52px;
}
.rc-chain li.r .rc-k{color:var(--brand-deep);font-weight:700}
.rc-ev{margin-top:10px;padding-left:22px}

/* ══════════ 2×2 优先级矩阵 ══════════ */
.mx{display:grid;grid-template-columns:22px 1fr;grid-template-rows:1fr 22px;gap:8px}
.mx-y{grid-row:1;grid-column:1;display:flex;align-items:center;justify-content:center}
.mx-y span{
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink-2);text-transform:uppercase;
}
.mx-grid{grid-row:1;grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:0;
  border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.mx-x{grid-row:2;grid-column:2;text-align:center}
.mx-x span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink-2);text-transform:uppercase}
.mq{
  background:var(--card);padding:16px 18px;
  border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  border-top:3px solid var(--ink-4);min-height:120px;
}
.mq h4{font-size:13.5px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.mq h4 .cnt{
  font-family:var(--f-mono);font-size:10px;font-weight:700;
  background:var(--paper-2);padding:1px 6px;color:var(--ink-2);
}
.mq .hint{font-size:11px;color:var(--ink-3);margin-bottom:11px;line-height:1.5}
.mq ul{list-style:none}
.mq li{
  font-size:12.5px;color:var(--ink-2);line-height:1.55;padding:6px 0;
  border-top:1px solid var(--rule-soft);display:flex;gap:8px;align-items:baseline;
}
.mq li:first-child{border-top:0}
.mq li .g{font-family:var(--f-mono);font-size:10.5px;font-weight:700;color:var(--good);flex:none}
.mq.empty-q{opacity:.45}
.mq.empty-q ul{display:none}
.mq .none{font-size:12px;color:var(--ink-4)}
.mx-note{
  font-size:11.5px;color:var(--ink-3);margin-top:12px;line-height:1.6;
  font-family:var(--f-mono);letter-spacing:.02em;
}

/* ══════════ 多源交叉分析 ══════════ */
.x-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.x-lab{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);font-weight:700;margin-bottom:16px;
  padding-bottom:8px;border-bottom:1px solid var(--ink);
}

/* 叙事鸿沟 —— 双向轴：0 居中，负向左、正向右 */
.x-gap{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.x-gap-num{font-family:var(--f-display);font-size:46px;font-weight:700;letter-spacing:-.05em;line-height:1;
  font-variant-numeric:tabular-nums}
.x-gap-lb{font-size:11.5px;font-weight:700;padding:4px 10px;text-transform:uppercase;letter-spacing:.1em}
.x-gap-hint{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:10px}
.x-axis{margin-top:20px;padding-top:18px;border-top:1px solid var(--rule)}
.x-axis-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:12.5px}
.x-axis-nm{width:66px;color:var(--ink-2);flex:none}
.x-axis-track{position:relative;flex:1;height:18px;background:var(--paper-3);overflow:hidden}
.x-axis-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--ink);z-index:2}
.x-axis-fill{position:absolute;top:3px;bottom:3px}
.x-axis-v{width:46px;text-align:right;font-family:var(--f-mono);font-weight:700;flex:none;font-size:13px;
  font-variant-numeric:tabular-nums}
.x-legend{margin-top:14px;font-size:11.5px;color:var(--ink-3);line-height:1.6}

/* 三源矩阵 */
.x-src{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.x-src-nm{width:76px;font-size:12.5px;color:var(--ink-2);flex:none}
.x-src-track{flex:1;height:12px;background:var(--paper-3);overflow:hidden;position:relative}
.x-src-fill{height:100%}
.x-src-th{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:2}
.x-src-v{width:34px;text-align:right;font-family:var(--f-mono);font-size:13px;font-weight:700;flex:none;
  font-variant-numeric:tabular-nums}
.x-src-bd{font-size:10.5px;color:var(--ink-2);margin-left:8px;white-space:nowrap;
  font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.x-quad{margin-top:20px;padding:14px 16px;border-left:4px solid;background:var(--paper-2)}
.x-quad-lb{font-size:14px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.x-quad-hint{font-size:12.5px;color:var(--ink-2);line-height:1.6}

/* 危机三通道 */
.x-cr{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.x-cr:last-child{border-bottom:0;padding-bottom:0}
.x-cr:first-child{padding-top:0}
.x-dot{width:11px;height:11px;flex:none;margin-top:4px}
.x-cr-b{flex:1;min-width:0}
.x-cr-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px}
.x-cr-nm{font-size:13px;font-weight:700;color:var(--ink)}
.x-cr-i{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.x-cr-r{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.x-cr-track{height:6px;background:var(--paper-3);margin-top:8px;overflow:hidden}
.x-cr-fill{height:100%}
.x-cr-hd{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.x-cr-score{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums}
.x-cr-lv{font-size:11.5px;font-weight:700;padding:4px 10px;text-transform:uppercase;letter-spacing:.1em}
.x-src-note{font-size:11.5px;color:var(--ink-3);margin-top:12px;line-height:1.6}

/* ══════════ 打印 ══════════ */
@media print{
  body{background:#fff;padding:0}
  body::after{display:none}
  .reveal,.hero-num,.radar-shape,.cov-bar i,.dim-meter i,.sov-track i,.proj-track i{animation:none!important;opacity:1!important;transform:none!important}
  section{break-inside:avoid;page-break-inside:avoid}
  .act:hover{background:none;margin:0;padding-left:0;padding-right:0}
  details.sim summary::after{content:"（见下）";font-size:11px;color:#8A8A8A}
  .x-axis-mid,.x-src-th,.mast-rule,.sec-rule{background:#000!important}
}
@media(max-width:640px){
  .wrap{max-width:100%;padding:0 18px}
  .hero{grid-template-columns:1fr}
  .hero-fig{border-right:0;border-bottom:1px solid var(--rule);padding:26px 0}
  .hero-body{padding:26px 0}
  .sec-note{margin-left:0;width:100%}
  .x-grid{grid-template-columns:1fr}
  .x-axis-nm{width:54px}
  .x-src-nm{width:62px}
  .foot{grid-template-columns:1fr}
  .foot-logo{grid-row:1;grid-column:1;margin-bottom:14px}
  .foot-credit{grid-row:2;grid-column:1}
  .foot-legend{grid-row:3;grid-column:1}
}
</style>

var A = window.__AUDIT__;
var app = document.getElementById('app');

if(!A || !A.stages){
  app.innerHTML = '<p class="empty" style="padding:60px 0">未注入审计数据。请用 build-report.js 生成。</p>';
  return;
}

var S = A.stages, meta = A.meta || {};
var score = A.score || {totalScore:0, level:'—', dimensions:[]};
var ev = A.evidence || {coverage:{L1:0,L2:0,L3:0}, confidence:{score:0,label:'—'}};
var total = score.totalScore;
// 行业基准（单一总分口径），供雷达图基准线使用
var BENCH = (S.SCORE && typeof S.SCORE.industryBenchmark === 'number') ? S.SCORE.industryBenchmark : null;
// 分维度行业基准（三级来源：竞品实测 > 本地累积 > 用户配置）
var BMT = A.benchmark || null;
// 执行摘要在 Hero 之前渲染，ov 需提前声明
var ov = S.OVERVIEW || {};

// 瑞士网格配色：单一强调色（品牌橙）+ 深色调色板，纯平无渐变。
// 权重最高的 RETRIEVABILITY 用品牌橙，视觉上先落在它身上。
var DIMC = {RETRIEVABILITY:'#D96F18', AUTHORITY:'#1F6B8F', CONTENT_ASSETS:'#2F7A5A',
            STRUCTURE_MARKUP:'#6B4E8C', SENTIMENT:'#B3261E', COMPETITIVE:'#8A6A1F'};
var LVC = {'优秀':'#1F7A4D','良好':'#2F7A6A','一般':'#8A6A1F','较差':'#B3261E'};
// 证据等级：黑(已验证) / 橙(检索命中) / 灰(推演) —— 强度递减即语义递减
var EVC = {L1:'#0A0A0A', L2:'#D96F18', L3:'#BFBFBF'};

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function pct(x){ return (Math.round((+x||0)*1000)/10).toFixed(1)+'%'; }
function dt(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso);
  function p(n){return n<10?'0'+n:''+n;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function color(v){ v=+v||0; return v>=90?LVC['优秀']:v>=75?LVC['良好']:v>=60?LVC['一般']:LVC['较差']; }
function signed(n){ return n==null?'—':((n>0?'+':'')+n); }

function chip(k, v){
  return '<span class="chip '+k+'"><span class="k">'+k+'</span><span class="v">'+v+'</span></span>';
}

/* ── 六维雷达 ── */
function radar(dims){
  var W=430, H=350, cx=W/2, cy=H/2+4, R=113, n=dims.length;
  if(n<3) return '<p class="empty">维度不足，无法绘制雷达图</p>';
  var grid='', spoke='', pts=[], lbl='';
  [0.25,0.5,0.75,1].forEach(function(k){
    var d=[];
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+i*2*Math.PI/n;
      d.push((cx+R*k*Math.cos(a)).toFixed(1)+','+(cy+R*k*Math.sin(a)).toFixed(1));
    }
    grid+='<polygon points="'+d.join(' ')+'" fill="none" stroke="#DEDEDE" stroke-width="1"/>';
  });
  for(var i=0;i<n;i++){
    var a=-Math.PI/2+i*2*Math.PI/n;
    spoke+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a)).toFixed(1)+'" stroke="#DEDEDE" stroke-width="1"/>';
    var v=Math.max(0,Math.min(100,+dims[i].score||0))/100;
    var px=cx+R*v*Math.cos(a), py=cy+R*v*Math.sin(a);
    pts.push(px.toFixed(1)+','+py.toFixed(1));
    var lx=cx+(R+27)*Math.cos(a), ly=cy+(R+27)*Math.sin(a);
    var anch = Math.abs(Math.cos(a))<0.3 ? 'middle' : (Math.cos(a)>0?'start':'end');
    lbl+='<text x="'+lx.toFixed(1)+'" y="'+(ly+2).toFixed(1)+'" text-anchor="'+anch+'" font-size="12" fill="#525252" font-family="var(--f-body)">'+esc(dims[i].name)+'</text>';
    lbl+='<text x="'+lx.toFixed(1)+'" y="'+(ly+17).toFixed(1)+'" text-anchor="'+anch+'" font-size="13" font-weight="700" fill="'+(DIMC[dims[i].code]||'#0A0A0A')+'" font-family="var(--f-mono)">'+(+dims[i].score)+'</text>';
  }
  // ── 行业基准 ──
  // 优先画分维度基准（来自实测/累积/配置）；取不到才退回单一总分正六边形；
  // 都没有就不画 —— 留白而不是编一个数字。
  if(BMT && BMT.scores){
    var pts=[], knownIdx=[];
    for(var q=0;q<n;q++){
      var bv = BMT.scores[dims[q].code];
      if(bv===null || bv===undefined) continue;
      var ba=-Math.PI/2+q*2*Math.PI/n;
      var rr=R*(Math.max(0,Math.min(100,bv))/100);
      pts.push((cx+rr*Math.cos(ba)).toFixed(1)+','+(cy+rr*Math.sin(ba)).toFixed(1));
      knownIdx.push(q);
    }
    if(pts.length>=2){
      var bdash = BMT.source==='measured' ? '' : (BMT.source==='accumulated' ? '5 4' : '2 3');
      var bop = BMT.source==='measured' ? '.8' : '.7';
      // 已知点全部相邻且凑齐全部轴 → 闭合多边形；否则画开放折线（不虚构缺失轴）
      var closed = (knownIdx.length===n);
      grid += (closed ? '<polygon points="' : '<polyline points="') + pts.join(' ') + '" fill="none" '+
        'stroke="#B3261E" stroke-width="'+(BMT.source==='measured'?'1.7':'1.4')+'" '+
        (bdash?'stroke-dasharray="'+bdash+'" ':'')+'opacity="'+bop+'" stroke-linejoin="round"/>';
      // 在已知轴上点一个小方块，标出基准落点
      pts.forEach(function(pp){
        var c=pp.split(',');
        grid+='<rect x="'+(+c[0]-2.5).toFixed(1)+'" y="'+(+c[1]-2.5).toFixed(1)+
              '" width="5" height="5" fill="#B3261E" opacity="'+bop+'"/>';
      });
    }
  } else if(BENCH!==null && BENCH>0 && BENCH<100){
    // 兜底：单一总分口径，正六边形虚线
    var bd=[];
    for(var q2=0;q2<n;q2++){
      var ba2=-Math.PI/2+q2*2*Math.PI/n;
      bd.push((cx+R*(BENCH/100)*Math.cos(ba2)).toFixed(1)+','+(cy+R*(BENCH/100)*Math.sin(ba2)).toFixed(1));
    }
    grid+='<polygon points="'+bd.join(' ')+'" fill="none" stroke="#B3261E" stroke-width="1.4" '+
          'stroke-dasharray="5 4" opacity=".65"/>';
  }

  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:560px;display:block;margin:0 auto">'+
    grid+spoke+
    '<g class="radar-shape">'+
      '<polygon points="'+pts.join(' ')+'" fill="rgba(217,111,24,.13)" stroke="#D96F18" stroke-width="2" stroke-linejoin="round"/>'+
      pts.map(function(p){var c=p.split(',');return '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="4" fill="#fff" stroke="#D96F18" stroke-width="2"/>';}).join('')+
    '</g>'+lbl+'</svg>';
}

/* ── 覆盖条 ── */
function covbar(c, delayBase){
  var o={L1:0,L2:0,L3:0}, t=0;
  ['L1','L2','L3'].forEach(function(k){ var v=+c[k]||0; if(v>0){o[k]=v;t+=v;} });
  if(t<=0) return '';
  var s='', i=0;
  ['L1','L2','L3'].forEach(function(k){
    if(o[k]<=0) return;
    s+='<i style="width:'+(o[k]/t*100).toFixed(1)+'%;background:'+EVC[k]+
       ';animation-delay:'+((delayBase||0.5)+i*0.09).toFixed(2)+'s"></i>';
    i++;
  });
  return s;
}

/* ── 证据 chip（可点链接） ── */
function evTagHTML(ev){
  if(!ev || !ev.level) return '';
  var M = {L1:{l:'已验证',c:'#1F7A4D'}, L2:{l:'检索命中',c:'#1F6B8F'}, L3:{l:'推演估计',c:'#BFBFBF'}};
  var meta = M[ev.level];
  if(!meta) return '';
  var url = (ev.sources && ev.sources[0] && ev.sources[0].url) || '';
  var inner = '<span class="k">'+ev.level+'</span><span class="v">'+meta.l+'</span>';
  return url
    ? '<a class="chip '+ev.level+'" href="'+esc(url)+'" target="_blank" rel="noopener">'+inner+'</a>'
    : '<span class="chip '+ev.level+'">'+inner+'</span>';
}

/* ── 2×2 优先级矩阵（节点侧逻辑的浏览器版） ── */
var QD = {
  quick:      { label:'速赢',     hint:'高影响 · 易落地，优先开工', color:'#1F7A4D' },
  strategic:  { label:'重点投入', hint:'高影响 · 需专项资源',     color:'#1F6B8F' },
  fillin:     { label:'补齐',     hint:'影响有限 · 顺手做',       color:'#8A6A1F' },
  reconsider: { label:'暂缓',     hint:'影响低 · 投入大，再评估', color:'#BFBFBF' }
};
function prioritize(actions){
  var out={quadrants:{quick:[],strategic:[],fillin:[],reconsider:[]}, mean:0};
  if(!Array.isArray(actions)||!actions.length) return out;
  var gains=actions.map(function(a){return Number(a.expectedGain)||0;});
  var mean=gains.reduce(function(a,b){return a+b;},0)/gains.length;
  out.mean=Math.round(mean*10)/10;
  actions.forEach(function(a){
    var g=Number(a.expectedGain)||0;
    var hi=g>=mean, hf=a.effort!=='heavy';
    var q = hi ? (hf?'quick':'strategic') : (hf?'fillin':'reconsider');
    out.quadrants[q].push({action:a, gain:g});
  });
  return out;
}
function matrixHTML(actions){
  var pr=prioritize(actions);
  if(!actions||!actions.length) return '<p class="empty">无行动项</p>';
  function cell(key){
    var items=pr.quadrants[key], q=QD[key];
    var s='<div class="mq'+(items.length?'':' empty-q')+'" style="border-top-color:'+q.color+'">'+
      '<h4><span style="color:'+q.color+'">'+q.label+'</span><span class="cnt">'+items.length+'</span></h4>'+
      '<div class="hint">'+q.hint+'</div>';
    if(items.length){
      s+='<ul>';
      items.forEach(function(it){
        s+='<li><span class="g">+'+it.gain+'</span><span>'+esc(it.action.title)+'</span></li>';
      });
      s+='</ul>';
    } else s+='<div class="none">无</div>';
    return s+'</div>';
  }
  return '<div class="mx">'+
    '<div class="mx-y"><span>影响力 ↑</span></div>'+
    '<div class="mx-grid">'+cell('strategic')+cell('quick')+cell('reconsider')+cell('fillin')+'</div>'+
    '<div class="mx-x"><span>可行性 →</span></div></div>'+
    '<div class="mx-note">象限口径：影响力按本报告预期提分均值 '+pr.mean+
    ' 分二分（相对口径）；可行性按工时二分，heavy 归入低可行性。</div>';
}

      if(v===null||v===undefined){
        return '<div class="x-src"><span class="x-src-nm">'+esc(nm)+'</span>'+
          '<span class="x-src-track"><i class="x-src-th" style="left:'+th+'%"></i></span>'+
          '<span class="x-src-v" style="color:var(--ink-4)">—</span>'+
          '<span class="x-src-bd" style="color:var(--ink-4)">未采集</span></div>';
      }
      var c = band ? band.color : (v>=th ? 'var(--good)' : 'var(--warn)');
      return '<div class="x-src"><span class="x-src-nm">'+esc(nm)+'</span>'+
        '<span class="x-src-track"><i class="x-src-th" style="left:'+th+'%"></i>'+
        '<i class="x-src-fill" style="width:'+Math.max(1,v)+'%;background:'+c+'"></i></span>'+
        '<span class="x-src-v" style="color:'+c+'">'+v+'</span>'+
        (band?'<span class="x-src-bd">'+esc(band.label)+'</span>':'')+'</div>';
    }

    var sCard = '<div class="card">'+
      '<div class="x-lab">三源可见度矩阵</div>'+
      srcRow('检索可见度', TS.visibilityIndex, TS.thresholds.visibility, null)+
      srcRow('社媒声量', TS.socialIndex, TS.thresholds.social, TS.bands.social)+
      srcRow('热搜热度', TS.hotIndex, TS.thresholds.hotsearch, TS.bands.hotsearch)+
      '<div class="x-quad" style="border-color:'+TS.quadrantColor+'">'+
        '<div class="x-quad-lb" style="color:'+TS.quadrantColor+'">'+esc(TS.quadrantLabel)+'</div>'+
        '<div class="x-quad-hint">'+esc(TS.quadrantHint)+'</div>'+
      '</div>'+
      '<div class="x-src-note">竖线为各源的高/低分界：检索可见度 '+TS.thresholds.visibility+
        ' 分（对齐本报告「一般」评级线），社媒与热搜 '+TS.thresholds.social+
        ' 分（声量活跃线）。三源量纲不同，仅作相对定位，不代表绝对市场份额。</div>'+
      '</div>';

    H+='<section class="reveal"'+REVEAL()+'>'+
      '<div class="sec-head"><span class="sec-no">'+secNum()+'</span><h2 class="sec-title">多源交叉分析</h2>'+
        '<span class="sec-note">检索 × 社媒 × 热搜 三源对齐</span></div>'+
      '<div class="sec-rule"></div>'+
      '<div class="x-grid">'+gCard+sCard+'</div>';

    // ── 危机三通道 ──
    var crColor = CR.score>=60?'var(--bad)':(CR.score>=30?'var(--warn)':'var(--good)');
    var crh = '<div class="x-cr-hd">'+
      '<span class="x-cr-score" style="color:'+crColor+'">'+CR.score+'</span>'+
      '<span class="x-cr-lv" style="background:'+crColor+'18;color:'+crColor+'">'+esc(CR.levelLabel)+'</span>'+
      '<span style="font-size:12px;color:var(--ink-4)">'+CR.triggeredCount+' / '+CR.channelsWithData+
        ' 个有数据的通道触发（危机评分可信度 '+CR.confidence+'%）</span></div>';
    CR.channels.forEach(function(ch){
      var dot = !ch.hasData ? 'var(--ink-4)' : (ch.triggered ? 'var(--bad)' : 'var(--good)');
      var fill = !ch.hasData ? 'var(--ink-4)' : (ch.triggered ? 'var(--bad)' : 'var(--good)');
      crh+='<div class="x-cr">'+
        '<span class="x-dot" style="background:'+dot+'"></span>'+
        '<div class="x-cr-b">'+
          '<div class="x-cr-t"><span class="x-cr-nm">'+esc(ch.name)+'</span>'+
            '<span class="x-cr-i">强度 '+ch.intensity+'</span></div>'+
          '<div class="x-cr-r">'+esc(ch.reason)+'</div>'+
          (ch.hasData?'<div class="x-cr-track"><i class="x-cr-fill" style="width:'+ch.intensity+'%;background:'+fill+'"></i></div>':'')+
        '</div></div>';
    });
    H+='<div class="card" style="margin-top:22px">'+
      '<div class="x-lab">危机三通道 · 任一通道亮红灯即预警</div>'+crh+'</div>';

    // ── 社媒真实样本（标题必须可点击，便于逐条核查）──
    var SOC = S.SOCIAL;
    if(SOC && Array.isArray(SOC.posts) && SOC.posts.length){
      var pr='';
      SOC.posts.forEach(function(p){
        var sc = p.sentiment==='negative'?'var(--bad)':(p.sentiment==='positive'?'var(--good)':'var(--ink-3)');
        var sl = p.sentiment==='negative'?'负面':(p.sentiment==='positive'?'正面':'中性');
        pr+='<tr class="dim-row"><td>'+esc(p.platform||'')+'</td>'+
          '<td>'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a>':esc(p.title))+'</td>'+
          '<td style="color:'+sc+'">'+sl+'</td>'+
          '<td class="r">'+(p.engagement?p.engagement.toLocaleString():'—')+'</td></tr>';
      });
      var platNote = (SOC.platforms||[]).map(function(pp){
        return esc(pp.platform)+' '+pp.itemCount+' 条';
      }).join(' · ');
      H+='<details class="sim" style="margin-top:22px"><summary>展开社媒真实样本（'+SOC.posts.length+' 条，标题可点击查看原帖）</summary>'+
        '<div class="sim-body">'+
        (platNote?'<div class="x-src-note" style="margin-bottom:12px">平台分布：'+platNote+
          (SOC.windowDays?' · 采集窗口 '+SOC.windowDays+' 天':'')+'</div>':'')+
        '<table><thead><tr><th>平台</th><th>标题（可点击）</th><th>情绪</th><th class="r">互动量</th></tr></thead>'+
        '<tbody>'+pr+'</tbody></table></div></details>';
    }

    // ── 竞品多维并集 ──
    var CU = X.competitorUnion||[];
    if(CU.length){
      var cr='';
      CU.forEach(function(x){
        cr+='<tr class="dim-row"><td>'+esc(x.name)+'</td>'+
          '<td class="r">'+(x.searchShare===null?'—':pct(x.searchShare))+'</td>'+
          '<td class="r">'+(x.socialMentions===null?'—':x.socialMentions)+'</td>'+
          '<td class="r">'+(x.onHotsearch?'是':'否')+'</td>'+
          '<td>'+esc(x.sources.join(' · '))+'</td></tr>';
      });
      H+='<details class="sim" style="margin-top:22px"><summary>展开竞品多维并集（'+CU.length+' 个）</summary>'+
        '<div class="sim-body">'+
        '<div class="x-src-note" style="margin-bottom:12px">合并「检索声量榜」与「社媒讨论」中出现的竞品。'+
          '「覆盖源」越多，说明该竞品在越多场景下与你正面竞争。</div>'+
        '<table><thead><tr><th>竞品</th><th class="r">检索声量</th><th class="r">社媒提及</th>'+
        '<th class="r">上热搜</th><th>覆盖源</th></tr></thead><tbody>'+cr+'</tbody></table>'+
        '</div></details>';
    }

    H+='</section>';
  }
}

/* ══════ 优化后预期 ══════ */
if(S.ACTION && S.ACTION.scoreProjection){
  var sp=S.ACTION.scoreProjection;
  var pd = (sp.dimensionProjections||[]).map(function(p, i){
    var spec = (score.dimensions||[]).filter(function(d){return d.code===p.dimension;})[0];
    return '<div class="proj"><div class="proj-top"><span class="proj-nm">'+esc(spec?spec.name:p.dimension)+'</span>'+
      '<span class="proj-d">'+p.current+' → <b>'+p.projected+'</b></span></div>'+
      '<div class="proj-rows">'+
      '<div class="proj-row"><span class="proj-lbl">当前</span><span class="proj-track"><i style="width:'+p.current+
        '%;background:#BFBFBF;animation-delay:'+(0.4+i*0.07).toFixed(2)+'s"></i></span><span class="proj-val">'+p.current+'</span></div>'+
      '<div class="proj-row"><span class="proj-lbl">预期</span><span class="proj-track"><i style="width:'+p.projected+
        '%;background:linear-gradient(90deg,#A9560F,#E8832C);animation-delay:'+(0.5+i*0.07).toFixed(2)+'s"></i></span><span class="proj-val">'+p.projected+'</span></div>'+
      '</div></div>';
  }).join('');
  H+='<section class="reveal"'+REVEAL()+'>'+
    '<div class="sec-head"><span class="sec-no">'+secNum()+'</span><h2 class="sec-title">优化后预期</h2>'+
      '<span class="sec-note">按全部行动项落地测算，非承诺值</span></div>'+
    '<div class="sec-rule"></div>'+
    '<div class="card">'+
      '<div class="score-jump" style="margin-bottom:22px">'+esc(sp.currentScore)+
        ' <span class="arrow">→</span> <span class="to">'+esc(sp.projectedScore)+'</span></div>'+
      pd+'</div></section>';
}

/* ══════ 优先行动 ══════ */
if(S.ACTION && S.ACTION.actions && S.ACTION.actions.length){
  var acts = S.ACTION.actions;
  H+='<section class="reveal"'+REVEAL()+'>'+
    '<div class="sec-head"><span class="sec-no">'+secNum()+'</span><h2 class="sec-title">行动优先级</h2>'+
      '<span class="sec-note">完整清单与证据表见 Markdown 执行版</span></div>'+
    '<div class="sec-rule"></div><div class="card">'+matrixHTML(acts)+'</div></section>';
}

/* ══════ 附录：AI 提及推演 ══════ */
if(S.SIMULATION && S.SIMULATION.enabled){
  var rows2='';
  (S.SIMULATION.platforms||[]).forEach(function(p){
    var r = (p.range&&p.range.length===2)?(pct(p.range[0])+' – '+pct(p.range[1])):'—';
    rows2+='<tr class="dim-row"><td>'+esc(p.platform)+'</td><td class="r">'+r+'</td><td class="r">'+esc(p.confidence)+'</td></tr>';
  });
  H+='<section class="reveal"'+REVEAL()+'>'+
    '<div class="sec-head"><span class="sec-no">附</span><h2 class="sec-title">AI 提及推演</h2></div>'+
    '<div class="sec-rule"></div>'+
    '<details class="sim"><summary>展开查看推演结果（不参与总分）</summary><div class="sim-body">'+
      '<div class="simwarn">⚠️ 以下为 AI 推演结果，非实测数据，不可对外引用，也不计入本报告总分。'+
      (S.SIMULATION.note?'<br>'+esc(S.SIMULATION.note):'')+'</div>'+
      (rows2?'<table><thead><tr><th>平台</th><th class="r">推演区间</th><th class="r">置信度</th></tr></thead><tbody>'+rows2+'</tbody></table>':'')+
    '</div></details></section>';
}

/* ══════ 页脚 ══════ */
var lowL1 = ev.coverage.L1 < 0.3;
H+='<footer class="foot">'+
  (lowL1?'<div class="lowl1">⚠️ <b>L1 已验证证据仅占 '+pct(ev.coverage.L1)+'</b>，低于 30%。本报告结论偏依赖检索命中与推演，正式交付建议用 <b>deep</b> 档重跑。</div>':'')+
  '<img class="foot-logo" src="'+LOGO+'" alt="Hyreal FDE">'+
  '<div class="foot-credit">由 <b>Hyreal FDE</b> · geo-brand-audit v'+esc(A.version||'1.0.0')+' 生成<br>'+esc(dt(A.generatedAt))+'</div>'+
  '<div class="foot-legend">L1 已验证 · L2 检索命中 · L3 推演估计</div>'+
'</footer>';

app.innerHTML = H;
})();
</script>
</body>
</html>
